[package]
name = "msk"
version = "1.0.0"
description = "MSK (My Saviour Knight) Desktop AI Companion"
authors = ["MSK Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-shell = "2.1.0"
tauri-plugin-global-shortcut = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
